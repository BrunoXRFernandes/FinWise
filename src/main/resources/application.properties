spring.application.name=FinWise

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finwise}
spring.datasource.username=${DB_USER:finwise}
spring.datasource.password=${DB_PASSWORD:finwise}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:change-me-in-prod}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

